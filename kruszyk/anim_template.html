<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root { --bg:#ffffff; --fg:#1d2433; --muted:#6b7280; --card:#f5f6f8; --line:#e3e6ea; --accent:#d62828; --good:#2a9d8f; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--fg); }
  #wrap { display:flex; gap:10px; height: 100vh; padding: 0; }
  #map { flex: 3; min-height: 420px; border-radius: 8px; }
  #panel { flex: 1; min-width: 270px; max-width: 360px; overflow-y: auto; font-size: 13px; }
  @media (max-width: 760px) { #wrap { flex-direction: column; height:auto; } #map { height: 60vh; } #panel { max-width:none; } }
  .card { background: var(--card); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; }
  .clock { font-size: 26px; font-weight: 700; }
  .row { display:flex; justify-content:space-between; padding: 2px 0; }
  .row b { font-variant-numeric: tabular-nums; }
  .big { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }
  .good { color: var(--good); } .bad { color: var(--accent); }
  button, select { font: inherit; padding: 5px 10px; border-radius: 6px; border: 1px solid var(--line); background: #fff; cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  input[type=range] { width: 100%; }
  .legend span { display:inline-flex; align-items:center; gap:4px; margin: 2px 8px 2px 0; }
  .dot { width:10px; height:10px; border-radius:50%; display:inline-block; border:1px solid #0003; }
  .lbl { background: transparent; border: 0; box-shadow: none; color: #fff; font-weight: 700; font-size: 11px;
         text-shadow: 0 0 3px #000, 0 0 3px #000; padding: 0; }
  .lbl::before { display:none; }
  #banner { position:absolute; top:10px; left:50%; transform:translateX(-50%); z-index:1000; padding:6px 14px;
            border-radius:8px; font-weight:700; color:#fff; display:none; box-shadow:0 2px 6px #0005; }
  .adv { padding:3px 0; border-bottom:1px solid var(--line); }
  .adv b { display:inline-block; min-width:34px; }
  .lbl.over { color:#ff4d4d; }
  .veh { font-size:18px; text-shadow:0 0 3px #fff; }
  .tag { color:#fff; font-weight:700; font-size:12px; text-shadow:0 0 3px #000,0 0 3px #000; white-space:nowrap; }
  canvas { width: 100%; height: 120px; background: #fff; border-radius: 6px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="map"><div id="banner"></div></div>
  <div id="panel">
    <div class="card">
      <div class="clock" id="clock">06:00</div>
      <div class="muted" id="policy"></div>
      <div style="display:flex; gap:6px; margin:6px 0">
        <button class="primary" id="play">▶ Start</button>
        <button id="reset">⟲</button>
        <select id="speed">
          <option value="60">×60</option><option value="120">×120</option><option value="300" selected>×300</option>
          <option value="600">×600</option><option value="1200">×1200</option>
        </select>
      </div>
      <input type="range" id="time" min="0" step="10" value="0">
    </div>
    <div class="card">
      <div class="row"><span>Koszt na tonę</span><span class="big" id="cpt">–</span></div>
      <div class="row muted"><span id="blabel">naturalny</span><b id="bcpt">–</b></div>
      <div class="row"><span>Różnica</span><b id="delta">–</b></div>
    </div>
    <div class="card">
      <div class="row"><span>Wywiezione</span><b id="dumped">0 t</b></div>
      <div class="row"><span>Koszt narastająco</span><b id="cost">0 zł</b></div>
      <div class="row"><span>Paliwo</span><b id="fuel">0 l</b></div>
      <div class="row"><span>Paliwo na tonę</span><b id="fuelt">–</b></div>
      <div class="row"><span>Kosz kruszarki</span><b id="hopper">0 t</b></div>
      <div class="row"><span>Wozidła w kolejce teraz</span><b id="queue">0</b></div>
      <div class="row"><span>Jadą / ładują / czekają</span><b id="mix">–</b></div>
    </div>
    <div class="card">
      <div class="muted">Koszt zł/t w czasie zmiany (czerwony: ten przydział, szary: naturalny)</div>
      <canvas id="chart" width="600" height="220"></canvas>
    </div>
    <div class="card" id="advice-card">
      <div class="muted">📱 Ekrany operatorów koparek</div>
      <div id="advice"></div>
    </div>
    <div class="card legend" id="legend"></div>
  </div>
</div>
<script>
const D = __DATA__;
const map = L.map('map', { zoomControl: true });
const GEO = 'https://mapy.geoportal.gov.pl/wss/service/PZGIK/';
const WHITE = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8/5+hHgAHggJ/PchI7wAAAABJRU5ErkJggg==';
function baseLayers(map) {
  const orto = L.tileLayer.wms(GEO + 'ORTO/WMS/HighResolution', { layers: 'Raster', format: 'image/jpeg', maxZoom: 21, attribution: 'Geoportal.gov.pl (GUGiK)' });
  const relief = L.tileLayer.wms(GEO + 'NMT/GRID1/WMS/ShadedRelief', { layers: 'Raster', format: 'image/png', maxZoom: 21, attribution: 'Geoportal.gov.pl (GUGiK)' });
  const plan = L.tileLayer(WHITE, { maxZoom: 22 });
  const esri = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 21, maxNativeZoom: 19 });
  orto.addTo(map);
  L.control.layers({ 'Ortofoto (Geoportal)': orto, 'Relief terenu (Geoportal)': relief, 'Plan': plan, 'Satelita Esri (zapas)': esri }).addTo(map);
}
baseLayers(map);
L.control.scale({ imperial: false }).addTo(map);

const bounds = [];
const N = D.net;
N.roads.forEach(r => {
  if (r.active === false) {
    L.polyline(r.coords, { color: '#9e9e9e', weight: 4, dashArray: '10 8' }).bindTooltip(`${r.name} · planowana`).addTo(map);
    return;
  }
  const c = r.kind === 'rampa' ? '#d500f9' : '#ffffff';
  L.polyline(r.coords, { color: '#000', weight: 10, opacity: 0.55 }).addTo(map);
  L.polyline(r.coords, { color: c, weight: 6, opacity: 0.95, dashArray: r.single ? '14 6' : null })
    .bindTooltip(`${r.name} · ${r.grade} %${r.single ? ' · jeden pas (mijanki)' : ''}`).addTo(map);
  r.coords.forEach(p => bounds.push(p));
});
N.piles.forEach(p => {
  p.polygon.forEach(q => bounds.push(q));
  L.polygon(p.polygon, { color: '#00e5ff', weight: 2, fillOpacity: 0.25 }).addTo(map);
  const c = p.polygon.reduce((a, q) => [a[0] + q[0] / p.polygon.length, a[1] + q[1] / p.polygon.length], [0, 0]);
  L.marker(c, { icon: L.divIcon({ className: '', html: `<div class="tag">${p.id} · ${p.material}</div>` }) }).addTo(map);
});
N.junctions.forEach(j => L.circleMarker([j.lat, j.lon], { radius: 5, color: '#000', weight: 1, fillColor: '#fff', fillOpacity: 1 })
  .bindTooltip(`węzeł · rzędna ${j.elev} m`).addTo(map));
const DED_COLOR = { 'ekipa': '#ff006e', 'sztygar': '#3a86ff', 'cysterna': '#8338ec' };
(N.dedicated || []).forEach(d => L.polyline(d.coords, { color: DED_COLOR[d.for] || '#ffbe0b', weight: 3, dashArray: '6 6' })
  .bindTooltip(`trasa dedykowana: ${d.for}`).addTo(map));
(N.dig || []).forEach(d => {
  L.polyline(d.coords, { color: '#ff9f1c', weight: 4, dashArray: '2 8', opacity: 0.95 }).bindTooltip(`kierunek urabiania ${d.id}`).addTo(map);
  const e = d.coords[d.coords.length - 1];
  L.marker(e, { icon: L.divIcon({ className: '', html: '<div style="color:#ff9f1c;font-size:16px;text-shadow:0 0 3px #000">⏵</div>' }) }).addTo(map);
});
(N.bays || []).forEach(b => L.marker([b.lat, b.lon], { icon: L.divIcon({ className: '',
  html: '<div class="tag">⇆ M</div>' }) }).bindTooltip('mijanka').addTo(map));
(N.parking || []).forEach(p => L.marker([p.lat, p.lon], { icon: L.divIcon({ className: '',
  html: `<div class="tag">🅿️ ${p.excavator}</div>` }) }).addTo(map));
if (N.blast) L.marker([N.blast.lat, N.blast.lon], { icon: L.divIcon({ className: '', html: '<div style="font-size:20px">💥</div>' }) })
  .bindTooltip('miejsce strzelania').addTo(map);
const exMarkers = {};
N.excavators.forEach(e => { exMarkers[e.id] = L.marker([e.lat, e.lon], { icon: L.divIcon({ className: '',
  html: `<div class="tag" style="transform:translate(-50%,-30px)">⛏️ ${e.id}${e.elev !== null && e.elev !== undefined ? ' · ' + e.elev + ' m' : ''}</div>` }) }).addTo(map); });
const exTracks = Object.entries(D.excavator_tracks || {}).filter(([id]) => exMarkers[id]).map(([id, f]) => ({ v: { frames: f }, m: exMarkers[id], i: 0 }));
N.excavators.forEach(e => bounds.push([e.lat, e.lon]));
if (N.crusher) bounds.push([N.crusher.lat, N.crusher.lon]);
if (N.crusher) L.marker([N.crusher.lat, N.crusher.lon], { icon: L.divIcon({ className: '', html: `<div class="tag" style="transform:translate(-50%,-30px)">🏭 ${(N.crushers || []).length ? (N.crusher.id || 'C-1') : 'kruszarka'}${N.crusher.product ? ' · ' + N.crusher.product : ''}</div>` }) }).addTo(map);
(N.crushers || []).forEach(c => {
  bounds.push([c.lat, c.lon]);
  L.marker([c.lat, c.lon], { icon: L.divIcon({ className: '', html: `<div class="tag" style="transform:translate(-50%,-30px)">🏭 ${c.id}${c.product ? ' · ' + c.product : ''}</div>` }) }).addTo(map);
});
function fit() { if (bounds.length) map.fitBounds(bounds, { padding: [50, 50] }); else map.setView(N.center || [52, 19], N.zoom || 15); }
fit();
// the page may be rendered in a hidden tab (size 0): refit as soon as the map becomes visible
const visible = () => { const m = document.getElementById('map'); return m.clientWidth > 50 && m.clientHeight > 50; };
let fitted = visible();
new ResizeObserver(() => {
  const ok = visible();
  map.invalidateSize();
  if (ok && !fitted) { fitted = true; fit(); }
}).observe(document.getElementById('map'));

const trucks = Object.entries(D.trucks).map(([id, f]) => {
  const m = L.circleMarker([f[0][1], f[0][2]], { radius: 7, color: '#000', weight: 1, fillOpacity: 1, fillColor: '#aaa' })
    .bindTooltip(id, { permanent: true, direction: 'right', offset: [6, 0], className: 'lbl' }).addTo(map);
  return { id, f, m, i: 0, code: -1, label: '' };
});

// light vehicles: blasting crew, foreman, fuel tanker
const ICON = { 'strzelanie': '🧨', 'objazd': '👷', 'cysterna': '⛽' };
const lights = (D.light || []).filter(v => v.frames && v.frames.length > 1).map(v => {
  const m = L.marker([v.frames[0][1], v.frames[0][2]], { icon: L.divIcon({ className: '',
    html: `<div class="veh" title="${v.name}">${ICON[v.kind] || '🚙'}</div>`, iconAnchor: [9, 9] }) })
    .bindTooltip(v.name, { direction: 'top' });
  return { v, m, i: 0, on: false };
});
function locateLight(o, t) {
  const f = o.v.frames;
  if (t < f[0][0] || t > f[f.length - 1][0]) return null;
  if (t < f[o.i][0]) o.i = 0;
  while (o.i < f.length - 2 && f[o.i + 1][0] <= t) o.i++;
  const a = f[o.i], b = f[Math.min(o.i + 1, f.length - 1)];
  if (b[0] === a[0]) return [b[1], b[2]];
  const k = Math.min(1, Math.max(0, (t - a[0]) / (b[0] - a[0])));
  return [a[1] + k * (b[1] - a[1]), a[2] + k * (b[2] - a[2])];
}
function speedOf(tr) {
  const f = tr.f, a = f[tr.i], b = f[Math.min(tr.i + 1, f.length - 1)];
  if (!a[4] || b[0] <= a[0]) return null;
  const d = map.distance([a[1], a[2]], [b[1], b[2]]);
  return { v: d / (b[0] - a[0]) * 3.6, limit: a[4] };
}

function locate(tr, t) {
  const f = tr.f;
  if (t < f[tr.i][0]) tr.i = 0;
  while (tr.i < f.length - 2 && f[tr.i + 1][0] <= t) tr.i++;
  const a = f[tr.i], b = f[Math.min(tr.i + 1, f.length - 1)];
  if (t >= b[0] || b[0] === a[0]) return [b[1], b[2], t >= b[0] ? b[3] : a[3]];
  const k = (t - a[0]) / (b[0] - a[0]);
  return [a[1] + k * (b[1] - a[1]), a[2] + k * (b[2] - a[2]), a[3] === b[3] ? a[3] : a[3]];
}

const S = D.series, B = D.baseline;
const el = id => document.getElementById(id);
const fmt = (v, d = 0) => v === null || v === undefined ? '–' : v.toLocaleString('pl-PL', { minimumFractionDigits: d, maximumFractionDigits: d });
el('policy').textContent = D.label;
el('blabel').textContent = D.baseline_label + ' (ten sam dzień)';
if (!B) {  // no comparison: hide its rows and adjust the chart caption
  el('bcpt').parentElement.style.display = 'none';
  el('delta').parentElement.style.display = 'none';
  el('chart').previousElementSibling.textContent = 'Koszt zł/t w czasie zmiany';
}
el('time').max = D.shift_s;
const drive = new Set([0, 1, 2]), load = new Set([4, 5]), queues = new Set(D.queue_codes);
el('legend').innerHTML = D.states.filter(s => s !== 'start').map(s =>
  `<span><i class="dot" style="background:${D.colors[s]}"></i>${D.labels[s]}</span>`).join('');

let t = 0, playing = false, last = null, lastPanel = 0;
function draw() {
  let q = 0, nd = 0, nl = 0;
  trucks.forEach(tr => {
    const [lat, lon, c] = locate(tr, t);
    tr.m.setLatLng([lat, lon]);
    if (c !== tr.code) { tr.code = c; tr.m.setStyle({ fillColor: D.colors[D.states[c]] }); }
    if (queues.has(c)) q++; else if (drive.has(c)) nd++; else if (load.has(c)) nl++;
  });
  exTracks.forEach(o => { const p = locateLight(o, t); if (p) o.m.setLatLng(p); });
  lights.forEach(o => {
    const p = locateLight(o, t);
    if (p) { o.m.setLatLng(p); if (!o.on) { o.m.addTo(map); o.on = true; } }
    else if (o.on) { o.m.remove(); o.on = false; }
  });
  const now = performance.now();
  if (now - lastPanel < 90 && playing) return;
  lastPanel = now;
  const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60);
  const [h0, m0] = (D.start_clock || '06:00').split(':').map(Number);
  const tot = (h0 * 60 + m0 + h * 60 + m) % 1440;
  el('clock').textContent = `${String(Math.floor(tot / 60)).padStart(2, '0')}:${String(tot % 60).padStart(2, '0')}`;
  trucks.forEach(tr => {
    const sp = speedOf(tr);
    const txt = sp ? `${tr.id} · ${Math.round(sp.v)} km/h` : tr.id;
    const over = sp && sp.v > sp.limit + 0.5;
    if (txt !== tr.label) {
      tr.label = txt;
      tr.m.setTooltipContent(over ? `<span style="color:#ff4d4d">${txt} ⚠ limit ${sp.limit}</span>` : txt);
    }
  });
  const inWin = w => w && t >= w[0] && t < w[1];
  const bn = el('banner');
  if (inWin(D.closure)) { bn.style.display = 'block'; bn.style.background = '#d00000'; bn.textContent = '🔴 STRZELANIE – wyrobisko zamknięte dla wozideł'; }
  else if ((D.breaks || []).some(inWin)) { bn.style.display = 'block'; bn.style.background = '#e09f3e'; bn.textContent = '⏸ Przerwa'; }
  else if (t < (D.t_start || 0)) { bn.style.display = 'block'; bn.style.background = '#6c757d'; bn.textContent = '🔑 Rozruch – przejęcie i rozgrzanie maszyn'; }
  else bn.style.display = 'none';
  if (D.advice) {
    const mi = Math.floor(t / 60);
    el('advice').innerHTML = Object.entries(D.advice).map(([ex, lines]) =>
      `<div class="adv"><b>${ex}</b> ${lines[Math.min(mi, lines.length - 1)] || ''}</div>`).join('');
  }
  el('time').value = t;
  el('queue').textContent = q;
  el('queue').className = q > 2 ? 'bad' : '';
  el('mix').textContent = `${nd} / ${nl} / ${q}`;
  if (!S.t) return;
  const i = Math.min(Math.floor(t / 60), S.t.length - 1);
  el('dumped').textContent = fmt(S.dumped[i]) + ' t';
  el('cost').textContent = fmt(S.cost[i]) + ' zł';
  el('fuel').textContent = fmt(S.fuel[i]) + ' l';
  el('fuelt').textContent = S.dumped[i] ? fmt(S.fuel[i] / S.dumped[i], 3) + ' l/t' : '–';
  el('hopper').textContent = fmt(S.hopper[i]) + ' / ' + fmt(D.hopper_cap) + ' t';
  el('cpt').textContent = S.cpt[i] ? fmt(S.cpt[i], 2) + ' zł/t' : '–';
  if (B && B.t) {
    const j = Math.min(i, B.t.length - 1);
    el('bcpt').textContent = B.cpt[j] ? fmt(B.cpt[j], 2) + ' zł/t' : '–';
    if (S.cpt[i] && B.cpt[j]) {
      const d = 100 * (S.cpt[i] / B.cpt[j] - 1);
      el('delta').textContent = (d > 0 ? '+' : '') + fmt(d, 1) + ' %';
      el('delta').className = d < 0 ? 'good' : 'bad';
    }
  }
  chart(i);
}

function chart(i) {
  const c = el('chart'), g = c.getContext('2d'), W = c.width, H = c.height;
  g.clearRect(0, 0, W, H);
  const n = S.t.length, start = Math.min(45, n - 1);  // first minutes: cost/t is meaningless
  const vals = [...S.cpt.slice(start), ...(B ? B.cpt.slice(start) : [])].filter(v => v);
  if (!vals.length) return;
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const pad = (hi - lo) * 0.1 || 1; lo -= pad; hi += pad;
  const x = k => 30 + (W - 40) * k / (n - 1), y = v => H - 18 - (H - 30) * (v - lo) / (hi - lo);
  g.strokeStyle = '#e3e6ea'; g.fillStyle = '#6b7280'; g.font = '18px system-ui';
  [lo + pad, hi - pad].forEach(v => { g.beginPath(); g.moveTo(30, y(v)); g.lineTo(W - 10, y(v)); g.stroke(); g.fillText(v.toFixed(1), 0, y(v) + 5); });
  const line = (arr, to, color, w) => {
    g.strokeStyle = color; g.lineWidth = w; g.beginPath(); let on = false;
    for (let k = start; k <= to; k++) { if (!arr[k]) continue; on ? g.lineTo(x(k), y(arr[k])) : g.moveTo(x(k), y(arr[k])); on = true; }
    g.stroke();
  };
  if (B) line(B.cpt, Math.min(i, B.t.length - 1), '#9aa0a6', 3);
  line(S.cpt, i, '#d62828', 4);
  g.lineWidth = 1;
}

function loop(ts) {
  if (playing) {
    if (last !== null) t = Math.min(D.shift_s, t + (ts - last) / 1000 * Number(el('speed').value));
    if (t >= D.shift_s) { playing = false; el('play').textContent = '▶ Start'; }
    draw();
  }
  last = ts;
  requestAnimationFrame(loop);
}
el('play').onclick = () => { playing = !playing; el('play').textContent = playing ? '⏸ Pauza' : '▶ Start'; if (t >= D.shift_s) t = 0; };
el('reset').onclick = () => { t = 0; trucks.forEach(tr => tr.i = 0); draw(); };
el('time').oninput = e => { t = Number(e.target.value); trucks.forEach(tr => tr.i = 0); draw(); };
draw();
requestAnimationFrame(loop);
</script>
</body>
</html>
